name: Bajuju Mobile Release Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-mobile-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Bajuju release checks
        run: npm run check:release
