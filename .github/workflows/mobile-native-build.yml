name: Bajuju native event links
on:
  push:
    branches: [main]
    paths: [.native-release-trigger]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run check:prebuild
      - name: Build production binary
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"
        run: |
          test -n "$EXPO_TOKEN"
          npx eas-cli@latest build --platform ${{ matrix.platform }} --profile production --non-interactive --wait
