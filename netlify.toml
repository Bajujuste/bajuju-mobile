[build]
  command = "echo nessuna build"
  publish = "public"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
