name: One-shot safe experience detail patch
# one-shot trigger 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-safe-detail.yml'

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch experience detail safely
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/experience-detail.tsx')
          text = path.read_text()

          start_marker = '  async function joinExperience() {'
          end_marker = '\n  async function leaveExperience()'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('joinExperience markers not unique')

          start = text.index(start_marker)
          end = text.index(end_marker, start)

          new_join = r'''  async function joinExperience() {
    if (!experienceId || joining) return;

    if (!currentUserId) {
      Alert.alert('Login richiesto', 'Devi essere collegato per partecipare.');
      return;
    }

    if (isOrganizer) {
      Alert.alert('La organizzi tu', 'Questa esperienza l’hai creata tu.');
      return;
    }

    if (isParticipant) {
      Alert.alert('Sei già dentro', 'Stai già partecipando a questa esperienza.');
      return;
    }

    if (isFull) {
      router.push({
        pathname: '/experience-waitlist' as any,
        params: { id: experienceId },
      });
      return;
    }

    setJoining(true);

    try {
      const result = await supabase.rpc('join_standard_activity' as any, {
        p_activity_id: experienceId,
      });

      if (result.error) throw result.error;
      const data = result.data as any;

      if (data?.ok !== true) {
        const reason = String(data?.reason || '');

        if (reason === 'FULL') {
          Alert.alert(
            'Esperienza al completo',
            'Nel frattempo l’ultimo posto è stato occupato. Puoi entrare in lista d’attesa.',
            [
              { text: 'Chiudi', style: 'cancel' },
              {
                text: 'Lista d’attesa',
                onPress: () =>
                  router.push({
                    pathname: '/experience-waitlist' as any,
                    params: { id: experienceId },
                  }),
              },
            ]
          );
        } else if (reason === 'RESERVED') {
          Alert.alert(
            'Posto riservato',
            'Il posto libero è temporaneamente riservato a chi è prima in lista d’attesa.',
            [
              { text: 'Chiudi', style: 'cancel' },
              {
                text: 'Apri lista',
                onPress: () =>
                  router.push({
                    pathname: '/experience-waitlist' as any,
                    params: { id: experienceId },
                  }),
              },
            ]
          );
        } else if (reason === 'BLOCKED') {
          Alert.alert('Non disponibile', 'Non puoi partecipare a questa esperienza.');
        } else if (reason === 'PAST' || reason === 'UNAVAILABLE') {
          Alert.alert('Esperienza non disponibile', 'Non è più possibile partecipare a questa esperienza.');
        } else {
          Alert.alert('Non disponibile', 'Non è possibile partecipare in questo momento.');
        }
        return;
      }

      if (String(data?.status || '') === 'already_joined') {
        await loadParticipants(experienceId, experience);
        Alert.alert('Sei già dentro', 'Risulti già partecipante a questa esperienza.');
        return;
      }

      const organizerId = getExperienceCreatorId(experience);
      if (organizerId && organizerId !== currentUserId) {
        await sendBajujuPushNotification({
          type: 'new_participant',
          actorUserId: currentUserId,
          targetUserId: organizerId,
          title: 'Nuovo partecipante Bajuju',
          body: `Qualcuno si è unito alla tua esperienza: ${String(experience?.title || 'Bajuju')}.`,
          data: {
            screen: 'experience',
            activityId: experienceId,
          },
        }).catch(() => {
          console.log('Errore notifica nuovo partecipante.');
        });
      }

      await loadParticipants(experienceId, experience);
      await loadMessages(experienceId);
      Alert.alert('Ci sei!', 'Partecipazione registrata.');
    } catch (error: unknown) {
      console.log('Errore partecipazione esperienza.');
      Alert.alert(
        'Errore partecipazione',
        error instanceof Error
          ? error.message
          : 'Non sono riuscito a registrare la partecipazione. Riprova tra poco.'
      );
    } finally {
      setJoining(false);
    }
  }
'''

          text = text[:start] + new_join + text[end:]

          old_full = '''                ) : isFull ? (\n                  <View style={styles.smallStatusButton}>\n                    <Text style={styles.smallStatusButtonText}>Al completo</Text>\n                  </View>\n                ) : ('''
          new_full = '''                ) : isFull ? (\n                  <Pressable\n                    style={styles.smallJoinButton}\n                    onPress={() =>\n                      router.push({\n                        pathname: '/experience-waitlist' as any,\n                        params: { id: experienceId || '' },\n                      })\n                    }\n                  >\n                    <Text style={styles.smallJoinButtonText}>Lista d’attesa</Text>\n                  </Pressable>\n                ) : ('''

          if text.count(old_full) != 1:
              raise SystemExit('full-event action block not found exactly once')
          text = text.replace(old_full, new_full, 1)

          join_end = text.index(end_marker, text.index(start_marker))
          if ".from('activity_participants').insert" in text[text.index(start_marker):join_end]:
              raise SystemExit('direct participant insert still present in joinExperience')

          path.write_text(text)
          PY

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Commit checked change
        run: |
          git config user.name 'Bajuju Safety Bot'
          git config user.email 'info@bajuju.it'
          git add app/experience-detail.tsx
          git diff --cached --check
          git commit -m 'Fix: dettaglio usa partecipazione e lista attesa sicure'
          git push origin HEAD:main
