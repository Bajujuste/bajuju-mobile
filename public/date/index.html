    <!-- Invito «Installa BajujuDate»: su iPhone/iPad spiega Condividi › Aggiungi alla schermata Home; su Android porta a Google Play. Non compare se l'app è già aperta dalla schermata Home. -->
    <script>
      (function () {
        var ua = navigator.userAgent || "";
        var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var android = /Android/i.test(ua);
        var installed = navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
        if ((!ios && !android) || installed) return;
        var KEY = "bjd-installa-chiuso";
        try { var t = +localStorage.getItem(KEY); if (t && Date.now() - t < 3 * 864e5) return; } catch (e) {}
        var safari = ios && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA\//.test(ua);
        var share = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#007AFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
        var body = ios
          ? '<ol style="margin:10px 0 0;padding-left:20px;line-height:1.6">' +
              (safari ? "" : "<li>Apri questa pagina con <b>Safari</b></li>") +
              "<li>Tocca <b>Condividi</b> " + share + " in basso</li>" +
              "<li>Scegli <b>Aggiungi alla schermata Home</b></li>" +
              "<li>Tocca <b>Aggiungi</b>: il panda comparirà tra le tue app</li></ol>"
          : '<p style="margin:8px 0 0;line-height:1.5">Su Android BajujuDate funziona meglio con l’app: notifiche comprese.</p>' +
            '<a href="https://play.google.com/store/apps/details?id=it.amiva.app" style="display:block;margin-top:12px;padding:12px;border-radius:999px;background:#C8102E;color:#fff;text-align:center;font-weight:600;text-decoration:none">Scarica da Google Play</a>';
        function show() {
          var box = document.createElement("div");
          box.setAttribute("role", "dialog");
          box.setAttribute("aria-label", "Installa BajujuDate");
          box.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:99999;max-width:440px;margin:0 auto;background:#fff;color:#2A1A20;border:1px solid #F3D3D8;border-radius:20px;box-shadow:0 12px 40px rgba(120,10,30,.25);padding:16px 18px;font:15px/1.4 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif";
          box.innerHTML =
            '<div style="display:flex;align-items:center;gap:12px">' +
              '<img src="/date/apple-touch-icon.png" alt="" width="48" height="48" style="border-radius:12px;flex:none">' +
              '<b style="flex:1;font-size:17px">Installa BajujuDate</b>' +
              '<button type="button" aria-label="Chiudi" style="flex:none;border:0;background:#F6EEF0;color:#2A1A20;width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer">×</button>' +
            "</div>" + body;
          box.querySelector("button").onclick = function () {
            try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {}
            box.remove();
          };
          document.body.appendChild(box);
        }
        setTimeout(show, 1500);
      })();
    </script>
